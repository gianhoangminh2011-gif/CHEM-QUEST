
name: Save Load Validation

on:
  push:
    branches:
      - feature/beta-reuse-integration
  pull_request:
    branches:
      - feature/beta-reuse-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test, Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
