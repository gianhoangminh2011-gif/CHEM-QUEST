
name: CQ-OBS-03 Dependency Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Reproducible dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Validate target branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This audit must run on main."
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3

      - name: Record runtime and source hashes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cq-obs-03"
          node --version > "$RUNNER_TEMP/cq-obs-03/node-version.txt"
          npm --version > "$RUNNER_TEMP/cq-obs-03/npm-version.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/cq-obs-03/commit.txt"
          sha256sum package.json package-lock.json \
            > "$RUNNER_TEMP/cq-obs-03/source-sha256.txt"

      - name: Preserve committed dependency files
        shell: bash
        run: |
          cp package.json package-lock.json "$RUNNER_TEMP/cq-obs-03/"

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full dependency audit
        shell: bash
        run: |
          set +e
          npm audit --json \
            > "$RUNNER_TEMP/cq-obs-03/audit-all.json" \
            2> "$RUNNER_TEMP/cq-obs-03/audit-all.stderr"
          echo "$?" > "$RUNNER_TEMP/cq-obs-03/audit-all.exit"
          exit 0

      - name: Run production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json \
            > "$RUNNER_TEMP/cq-obs-03/audit-prod.json" \
            2> "$RUNNER_TEMP/cq-obs-03/audit-prod.stderr"
          echo "$?" > "$RUNNER_TEMP/cq-obs-03/audit-prod.exit"
          exit 0

      - name: Validate audit evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = process.env.RUNNER_TEMP + '/cq-obs-03';

          for (const name of ['all', 'prod']) {
            const exitCode = Number(
              fs.readFileSync(path.join(dir, `audit-${name}.exit`), 'utf8').trim()
            );

            if (exitCode !== 0) {
              throw new Error(`${name} audit failed with exit code ${exitCode}`);
            }

            const report = JSON.parse(
              fs.readFileSync(path.join(dir, `audit-${name}.json`), 'utf8')
            );

            if (!report.metadata || !report.metadata.vulnerabilities) {
              throw new Error(`${name} audit report is missing vulnerability metadata`);
            }

            const counts = report.metadata.vulnerabilities;
            const total = ['info', 'low', 'moderate', 'high', 'critical']
              .reduce((sum, key) => sum + Number(counts[key] || 0), 0);

            if (total !== 0) {
              throw new Error(`${name} audit found ${total} vulnerabilities`);
            }
          }
          NODE

      - name: Verify repository unchanged
        run: |
          git diff --exit-code -- package.json package-lock.json
          test -z "$(git status --porcelain)"

      - name: Create SHA256 manifest
        shell: bash
        run: |
          cd "$RUNNER_TEMP/cq-obs-03"
          sha256sum \
            package.json \
            package-lock.json \
            node-version.txt \
            npm-version.txt \
            commit.txt \
            source-sha256.txt \
            audit-all.json \
            audit-all.exit \
            audit-all.stderr \
            audit-prod.json \
            audit-prod.exit \
            audit-prod.stderr \
            > SHA256SUMS

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: cq-obs-03-dependency-audit-${{ github.sha }}
          path: ${{ runner.temp }}/cq-obs-03/
          if-no-files-found: error
          retention-days: 30
