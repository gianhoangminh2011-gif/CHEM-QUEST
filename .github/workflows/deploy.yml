name: Deploy CHEM QUEST to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      preview_ref:
        description: "Branch to publish under /preview/"
        required: true
        default: "feature/world-interaction-mvp"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install main dependencies
        run: npm install

      - name: Build main game
        run: npm run build

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.preview_ref || 'feature/world-interaction-mvp' }}
          path: preview-src

      - name: Install preview dependencies
        run: npm install
        working-directory: preview-src

      - name: Build preview game
        run: npm run build -- --base=/CHEM-QUEST/preview/
        working-directory: preview-src

      - name: Combine main and preview builds
        run: |
          mkdir -p dist/preview
          cp -R preview-src/dist/. dist/preview/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
